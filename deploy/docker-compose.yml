# Olymp + the four real cognitive-stack services on one Docker network.
#
# Image strategy: all five services pulled from GHCR.
#
#   mnemos  → ghcr.io/felixgeelhaar/mnemos:${MNEMOS_TAG}
#   chronos → ghcr.io/felixgeelhaar/chronos:${CHRONOS_TAG}
#   nous    → ghcr.io/felixgeelhaar/nous:${NOUS_TAG}
#   praxis  → ghcr.io/felixgeelhaar/praxis:${PRAXIS_TAG}
#   olymp   → ghcr.io/felixgeelhaar/olymp:${OLYMP_TAG}
#
# Pin versions via .env (copy .env.example).
#
# Quickstart:
#   cp deploy/.env.example deploy/.env       # edit if needed
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up
#   ./deploy/demo.sh

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olymp
      POSTGRES_PASSWORD: olymp
      POSTGRES_DB: olymp
      POSTGRES_MULTIPLE_DATABASES: olymp,mnemos,chronos,nous,praxis
    volumes:
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olymp"]
      interval: 5s
      timeout: 5s
      retries: 10

  mnemos:
    image: ghcr.io/felixgeelhaar/mnemos:${MNEMOS_TAG:-0.13.0}
    environment:
      MNEMOS_SERVE_PORT: "7777"
      # Mnemos uses a single MNEMOS_DB_URL (registered scheme dispatcher).
      MNEMOS_DB_URL: postgres://olymp:olymp@postgres:5432/mnemos?sslmode=disable
      # Shared HMAC secret. Olymp self-mints agent JWTs against this so
      # write paths to /v1/* succeed. Override via .env in production.
      MNEMOS_JWT_SECRET: ${STACK_JWT_SECRET_HEX:?STACK_JWT_SECRET_HEX must be set}
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7777:7777"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7777/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  chronos:
    image: ghcr.io/felixgeelhaar/chronos:${CHRONOS_TAG:-0.4.0}
    environment:
      CHRONOS_HTTP_HOST: "0.0.0.0"
      CHRONOS_HTTP_PORT: "7778"
      CHRONOS_DB_TYPE: postgres
      CHRONOS_DB_CONN: postgres://olymp:olymp@postgres:5432/chronos?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7778:7778"
    # Chronos ships a distroless image (no shell, no wget). Skip the
    # in-container healthcheck and rely on `service_started` for ordering.

  nous:
    image: ghcr.io/felixgeelhaar/nous:${NOUS_TAG:-0.2.0}
    environment:
      NOUS_HTTP_ADDR: ":8080"
      NOUS_DB_TYPE: postgres
      NOUS_DB_DSN: postgres://olymp:olymp@postgres:5432/nous?sslmode=disable
      NOUS_MNEMOS_URL: http://mnemos:7777
      NOUS_CHRONOS_URL: http://chronos:7778
      NOUS_PRAXIS_ADDR: http://praxis:8080
    depends_on:
      postgres:
        condition: service_healthy
      mnemos:
        condition: service_started
      chronos:
        condition: service_started
      praxis:
        condition: service_started
    ports:
      - "7780:8080"   # Nous HTTP
      - "50051:50051" # Nous gRPC
    # Nous ships a distroless image (no shell, no wget). Skip the
    # in-container healthcheck and rely on `service_started` for ordering.

  praxis:
    image: ghcr.io/felixgeelhaar/praxis:${PRAXIS_TAG:-0.1.0}
    environment:
      PRAXIS_HTTP_PORT: "8080"
      PRAXIS_DB_TYPE: postgres
      PRAXIS_DB_CONN: postgres://olymp:olymp@postgres:5432/praxis?sslmode=disable
      PRAXIS_MNEMOS_URL: http://mnemos:7777/v1/events
    depends_on:
      postgres:
        condition: service_healthy
      mnemos:
        condition: service_started
    ports:
      - "7781:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  olymp:
    image: ghcr.io/felixgeelhaar/olymp:${OLYMP_TAG:-0.1.2}
    environment:
      OLYMP_DB_TYPE: postgres
      OLYMP_DB_CONN: postgres://olymp:olymp@postgres:5432/olymp?sslmode=disable
      OLYMP_MNEMOS_URL: http://mnemos:7777
      OLYMP_CHRONOS_URL: http://chronos:7778
      OLYMP_NOUS_URL: http://nous:8080
      OLYMP_PRAXIS_URL: http://praxis:8080
      # Same HMAC secret as Mnemos. Olymp self-mints a 24-h agent JWT,
      # rotates it ahead of expiry, and attaches it to every Mnemos call.
      OLYMP_AUTH_SECRET_HEX: ${STACK_JWT_SECRET_HEX:?STACK_JWT_SECRET_HEX must be set}
      # Demo scope shared with prom2chronos. Olymp queries Chronos
      # signals scoped here when the loop's SignalQuery has no scope.
      OLYMP_CHRONOS_DEFAULT_SCOPE_ID: ${DEMO_CHRONOS_SCOPE_ID:-aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa}
    command: ["serve", "--addr", ":8080"]
    depends_on:
      postgres:
        condition: service_healthy
      mnemos:
        condition: service_started
      chronos:
        condition: service_started
      nous:
        condition: service_started
      praxis:
        condition: service_started
    ports:
      - "8080:8080"

  # --- Demo: broken services + Prometheus + Grafana + bridge ---

  flaky-payments:
    profiles: ["demo"]
    build:
      context: ./broken-services
      args:
        SERVICE: flaky-payments
    environment:
      ADDR: ":9101"
      RPS: "5"
    ports:
      - "9101:9101"

  slow-checkout:
    profiles: ["demo"]
    build:
      context: ./broken-services
      args:
        SERVICE: slow-checkout
    environment:
      ADDR: ":9102"
      RPS: "5"
    ports:
      - "9102:9102"

  prometheus:
    profiles: ["demo"]
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      flaky-payments:
        condition: service_started
      slow-checkout:
        condition: service_started

  grafana:
    profiles: ["demo"]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

  prom2chronos:
    profiles: ["demo"]
    build:
      context: ./prom2chronos
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      CHRONOS_URL: http://chronos:7778
      SCOPE_ID: ${DEMO_CHRONOS_SCOPE_ID:-aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa}
      POLL_INTERVAL: "10"
    depends_on:
      prometheus:
        condition: service_started
      chronos:
        condition: service_started

volumes:
  pgdata:
  promdata:
  grafanadata:
