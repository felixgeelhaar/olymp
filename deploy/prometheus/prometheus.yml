# Demo scrape config: the two broken sample services + Prometheus
# self-scrape so the dashboard has a baseline.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: flaky-payments
    static_configs:
      - targets: ["flaky-payments:9101"]

  - job_name: slow-checkout
    static_configs:
      - targets: ["slow-checkout:9102"]
